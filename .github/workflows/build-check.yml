name: Build Check

# 這個 workflow 只驗證「程式碼建置得起來」，不部署任何東西——
# 部署是 Render 在 push 到 main 之後自己做的，兩者互不相干。
#
# 為什麼後端只做編譯檢查而不啟動：app/firebase.py 在 import 階段就初始化
# Firebase SDK，CI 沒有 service account 憑證，import 進去必定失敗。要真的
# 跑起來得把憑證放進 secrets，那是另一件事，這裡先擋住語法與依賴的錯誤。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: 前端建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 對齊 frontend/Dockerfile 的 node:20-alpine
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安裝依賴
        working-directory: frontend
        run: npm ci

      - name: 建置
        working-directory: frontend
        # 不給 VITE_API_URL 與 VITE_SITE_URL：三個 vite plugin（seo /
        # sitemap / prerender）在取不到後端時都會退回預設值並印警告，
        # 這裡刻意走那條路徑，順便確認 fallback 沒有被改壞。
        run: npm run build

      - name: 確認產出存在
        working-directory: frontend
        # build 成功但沒吐出東西是有可能的（plugin 靜默失敗過），
        # 明確檢查一次比只看 exit code 可靠。
        run: test -f dist/index.html

  backend:
    name: 後端檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 對齊 backend/Dockerfile 的 python:3.11-slim
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安裝依賴
        # 真的裝一次，才能驗證釘死的那組版本彼此相容、而且都還在 PyPI 上。
        run: pip install -r backend/requirements.txt

      - name: 依賴衝突檢查
        run: pip check

      - name: 語法檢查
        run: python -m compileall -q backend

  guards:
    name: 防退化檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: requirements.txt 必須全部釘死版本
        # 只要有人加了沒有 == 的套件，build 的重現性就沒了。
        run: |
          bad=$(grep -vE '^\s*#|^\s*$' backend/requirements.txt | grep -v '==' || true)
          if [ -n "$bad" ]; then
            echo "以下套件沒有釘死版本："
            echo "$bad"
            exit 1
          fi
          echo "全部已釘死版本"

      - name: 不可有 CRLF 進入版控
        # .gitattributes 已經設了 eol=lf，這裡確認它真的生效——
        # 曾經有三個檔案帶著 CRLF 進版控，讓 diff 變成整份檔案重寫。
        run: |
          bad=$(git ls-files --eol | grep -E 'w/crlf|w/mixed' || true)
          if [ -n "$bad" ]; then
            echo "以下檔案的行尾不是 LF："
            echo "$bad"
            exit 1
          fi
          echo "行尾全部為 LF"
