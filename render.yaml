services:
  - type: web
    name: elementgroups-frontend
    env: static
    # npm ci 而不是 npm install：照 package-lock.json 安裝，讓 Render 上 build
    # 出來的東西和本機一致。用 cd 而不是 --prefix，是因為 npm ci 對 --prefix
    # 的處理在不同 npm 版本間不一致，cd 沒有這個疑慮。
    # staticPublishPath 由 Render 自己解析，不受這裡的 cd 影響。
    #
    # 前面那支 curl 是預熱（issue #45）：後端也在 Render 免費方案上、會休眠，
    # 冷啟動要 30〜60 秒。build 時它若正在睡，三個 vite plugin 取資料就會逾時，
    # 而預渲染取不到資料就整批略過——118 個元素頁對爬蟲會變成同一份空殼。
    # `|| true` 是刻意的：喚醒失敗不該讓 build 掛在這裡，plugin 內還有重試。
    #
    # 「取不到資料就讓 build 失敗」那道防線**不在這裡**——它靠 Render 自己注入
    # 的 RENDER 環境變數，寫在 frontend/build-fetch.js。原因是這份 render.yaml
    # 是否真的被套用無法保證（實測：加了 rewrite 規則後線上毫無變化），而防線
    # 放在沒人讀的檔案裡等於沒有防線。
    buildCommand: |
      if [ -n "$VITE_API_URL" ]; then
        curl -sS -m 120 --retry 2 --retry-delay 15 "$VITE_API_URL/ai/status" >/dev/null || true
      fi
      cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      # 這條必須排在 /* 之前（規則依序比對）。
      #
      # 為什麼需要它：Render「路徑上有資源就不套用規則」的規則**不含目錄索引**。
      # 實測（2026-09-02 部署後）——
      #   /stroy/H/index.html → Hydrogen H｜元素圖鑑…   3674 bytes
      #   /stroy/H/           → Hydrogen H｜元素圖鑑…   3674 bytes
      #   /stroy/H            → 元素圖鑑 Element Groups  2657 bytes  ← 被 /* 攔走
      # 預渲染的檔案確實產出了，但不帶尾斜線的裸路徑落回 index.html 空殼，
      # 而爬蟲與 sitemap 用的正是不帶尾斜線那個形式。
      #
      # 用 :symbol 而不是 /stroy/*：佔位符只吃單一路徑片段，`/stroy/H/` 這種
      # 帶尾斜線的不會被它捕捉成 `H/` 而組出 `/stroy/H//index.html`。
      - type: rewrite
        source: /stroy/:symbol
        destination: /stroy/:symbol/index.html
      - type: rewrite
        source: /*
        destination: /index.html
